<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SJ Montage – Fensterbauer Kapazitätskalender 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--bg2:#f8f9fa;--bg3:#f1f3f5;
  --text:#111827;--text2:#6b7280;--text3:#9ca3af;
  --border:#e5e7eb;--border2:#d1d5db;
  --blue:#1d4ed8;--blue-l:#dbeafe;--blue-lt:#eff6ff;
  --green:#15803d;--green-l:#dcfce7;
  --red:#b91c1c;--red-l:#fee2e2;
  --amber:#b45309;--amber-l:#fef3c7;
  --radius:8px;--radius-lg:12px;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --shadow-lg:0 4px 16px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;font-size:13px;color:var(--text);background:var(--bg3);min-height:100vh}
input,select,textarea,button{font-family:inherit;font-size:13px}
a{color:var(--blue);text-decoration:none}

/* ── LAYOUT ─────────────────────────────────────────────────── */
.app-shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.sidebar{background:var(--bg);border-right:1px solid var(--border);padding:0;display:flex;flex-direction:column}
.main{display:flex;flex-direction:column;overflow:hidden}

/* ── SIDEBAR ─────────────────────────────────────────────────── */
.logo{padding:18px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;background:var(--blue);border-radius:6px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:18px;height:18px;fill:#fff}
.logo-text{font-size:13px;font-weight:600;color:var(--text);line-height:1.3}
.logo-sub{font-size:10px;color:var(--text2);font-weight:400}

.nav-section{padding:12px 10px 4px;font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:var(--radius);margin:1px 8px;cursor:pointer;font-size:13px;color:var(--text2);transition:background .1s,color .1s;border:none;background:none;width:calc(100% - 16px);text-align:left}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.7}
.nav-item:hover,.nav-item.active{background:var(--blue-lt);color:var(--blue)}
.nav-item.active svg{opacity:1}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:20px;font-weight:600}

.sidebar-bottom{margin-top:auto;padding:12px 8px;border-top:1px solid var(--border)}
.user-row{display:flex;align-items:center;gap:9px;padding:8px 10px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}

/* ── TOPBAR ──────────────────────────────────────────────────── */
.topbar{background:var(--bg);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.topbar h1{font-size:15px;font-weight:600;flex:1}
.topbar-actions{display:flex;gap:8px;align-items:center}

/* ── BUTTONS ─────────────────────────────────────────────────── */
.btn{height:32px;padding:0 14px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;transition:background .1s,box-shadow .1s;white-space:nowrap}
.btn:hover{background:var(--bg2);box-shadow:var(--shadow)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.primary:hover{background:#1e40af}
.btn.danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn.danger:hover{background:#991b1b}
.btn.sm{height:26px;padding:0 10px;font-size:11px}
.btn svg{width:14px;height:14px;flex-shrink:0}

/* ── CONTENT AREA ────────────────────────────────────────────── */
.content{flex:1;padding:16px 20px;overflow-y:auto}

/* ── STATS ROW ───────────────────────────────────────────────── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:5px;font-weight:500}
.stat-val{font-size:22px;font-weight:600;line-height:1}
.stat-sub{font-size:10px;color:var(--text3);margin-top:3px}
.stat-card.warn .stat-val{color:var(--red)}

/* ── TOOLBAR ─────────────────────────────────────────────────── */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 14px}
.toolbar select,.toolbar input[type=text]{height:30px;padding:0 10px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);cursor:pointer}
.toolbar label{font-size:12px;color:var(--text2);font-weight:500}
.toolbar-sep{width:1px;height:22px;background:var(--border);margin:0 4px}

/* ── CALENDAR TABLE ──────────────────────────────────────────── */
.cal-wrap{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.cal-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:800px}
th{background:var(--bg2);font-size:11px;font-weight:600;padding:9px 8px;border-bottom:1px solid var(--border);text-align:center;position:sticky;top:0;z-index:3;white-space:nowrap}
th.nu-th{color:#fff;font-size:12px}
td{padding:4px 5px;border-bottom:1px solid var(--border);vertical-align:top;font-size:12px}
td.kw-td{text-align:center;background:var(--bg2);font-weight:600;font-size:14px;white-space:nowrap;border-right:1px solid var(--border)}
td.date-td{font-size:10px;color:var(--text2);text-align:center;white-space:nowrap;background:var(--bg2);border-right:1px solid var(--border)}
td.ft-td{font-size:10px;color:var(--red);font-style:italic;background:#fff8f8;border-right:1px solid var(--border);min-width:100px;max-width:130px}
tr.kw-first td{border-top:2px solid var(--border2)}
tr.sep-row td{height:3px;background:var(--bg3);padding:0;border:none}
tr.ft-row td{background:#fff5f5}
tr.ft-row td.kw-td,tr.ft-row td.date-td{background:#fee2e2}

/* ── PROJECT TAGS ────────────────────────────────────────────── */
.proj-cell{min-height:42px;padding:2px}
.proj-tag{display:flex;flex-direction:column;border-radius:6px;padding:5px 7px;margin-bottom:3px;cursor:pointer;transition:opacity .1s;border:none;width:100%;text-align:left;color:#fff}
.proj-tag:hover{opacity:.88}
.proj-tag-top{display:flex;align-items:center;gap:5px;justify-content:space-between}
.proj-tag-pnr{font-size:10px;font-weight:600;opacity:.9}
.proj-tag-ma{font-size:10px;font-weight:600;background:rgba(0,0,0,.2);padding:1px 5px;border-radius:10px}
.proj-tag-name{font-size:11px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;margin-top:2px}
.day-dots{display:flex;gap:2px;margin-top:3px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}
.dot.on{background:rgba(255,255,255,.9)}
.dot.off{background:rgba(255,0,0,.4)}
.add-btn{display:flex;align-items:center;justify-content:center;gap:4px;padding:5px;border:1px dashed var(--border2);border-radius:6px;cursor:pointer;font-size:11px;color:var(--text3);background:none;width:100%;transition:border-color .1s,color .1s;margin-top:2px}
.add-btn:hover{border-color:var(--blue);color:var(--blue)}

/* ── CONFLICT BANNER ─────────────────────────────────────────── */
.conflict-bar{background:var(--red-l);border:1px solid #fca5a5;border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--red);margin-bottom:12px;display:none;align-items:center;gap:8px}
.conflict-bar.show{display:flex}
.conflict-bar svg{width:16px;height:16px;flex-shrink:0}

/* ── MODAL ───────────────────────────────────────────────────── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg);border-radius:var(--radius-lg);padding:22px;width:440px;max-width:96vw;box-shadow:var(--shadow-lg);max-height:92vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.modal-header h2{font-size:15px;font-weight:600;flex:1}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text2);padding:4px;border-radius:var(--radius);display:flex}
.modal-close:hover{background:var(--bg2)}
.form-row{margin-bottom:13px}
.form-row label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);transition:border-color .1s}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--blue)}
.form-row textarea{resize:vertical;min-height:60px}
.form-row .hint{font-size:11px;color:var(--text3);margin-top:4px}
.day-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.day-btn{padding:6px 2px;border:1px solid var(--border2);border-radius:var(--radius);text-align:center;cursor:pointer;font-size:12px;font-weight:500;background:var(--bg);color:var(--text2);transition:all .1s;user-select:none}
.day-btn.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue)}
.day-btn.holiday{opacity:.45;cursor:not-allowed}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}

/* ── TABS ────────────────────────────────────────────────────── */
.tabs{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:3px;margin-bottom:16px;width:fit-content}
.tab{padding:5px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:var(--text2);border:none;background:none;transition:background .1s,color .1s}
.tab.active{background:var(--bg);color:var(--text);box-shadow:var(--shadow)}

/* ── PROTOKOLL ───────────────────────────────────────────────── */
.proto-table{width:100%;border-collapse:collapse}
.proto-table th{background:var(--bg2);font-size:11px;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);text-align:left}
.proto-table td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:top}
.proto-table tr:last-child td{border-bottom:none}
.proto-table tr:hover td{background:var(--bg2)}
.locked-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;background:var(--amber-l);color:var(--amber);padding:2px 7px;border-radius:20px;font-weight:500}

/* ── NU STAMMDATEN ───────────────────────────────────────────── */
.nu-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.nu-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px}
.nu-card-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.nu-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.nu-card-name{font-weight:600;font-size:13px}
.nu-card-field{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.nu-card-field label{font-size:10px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.nu-card-field input{padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;background:var(--bg);color:var(--text)}

/* ── DASHBOARD ───────────────────────────────────────────────── */
.week-preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:16px}
.week-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px}
.week-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.week-card-nu{font-weight:600;font-size:12px}
.week-card-kw{font-size:11px;color:var(--text2)}
.week-proj{display:flex;flex-direction:column;gap:4px}
.week-proj-item{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:6px;font-size:11px}
.week-proj-pnr{font-weight:600;font-size:10px;color:#fff;padding:1px 5px;border-radius:4px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state svg{width:40px;height:40px;opacity:.3;margin-bottom:10px}

/* ── NOTIFICATION TOAST ──────────────────────────────────────── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:#fff;padding:10px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;z-index:9999;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}

/* ── PRINT ───────────────────────────────────────────────────── */
@media print{
  .sidebar,.topbar,.toolbar,.modal-overlay,.toast{display:none!important}
  .main{width:100%;display:block}
  .content{padding:0;overflow:visible}
  .cal-scroll{overflow:visible}
  table{min-width:0;font-size:10px}
  th,td{padding:3px 4px}
}
@media(max-width:768px){
  .app-shell{grid-template-columns:1fr}
  .sidebar{display:none}
}

/* ══ AUFMAß STYLES ══════════════════════════════════════════════════ */
.am-steps{display:flex;gap:0;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);margin-bottom:16px}
.am-step{flex:1;padding:9px 6px;text-align:center;font-size:11px;font-weight:500;color:var(--text2);background:var(--bg2);cursor:pointer;border-right:1px solid var(--border);transition:all .15s;line-height:1.3}
.am-step:last-child{border-right:none}
.am-step.done{background:var(--green-l,#dcfce7);color:#166534}
.am-step.cur{background:var(--blue);color:#fff;font-weight:600}
.am-step:hover:not(.cur){background:var(--bg3,#f1f3f5)}
.am-snum{display:block;font-size:15px;font-weight:700;margin-bottom:1px}
.am-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px}
.am-card-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--bg2)}
.am-card-icon{width:34px;height:34px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.am-card-title{font-size:14px;font-weight:600}
.am-card-sub{font-size:11px;color:var(--text2);margin-top:1px}
.am-body{padding:18px}
.am-grid{display:grid;gap:12px}
.am-g2{grid-template-columns:1fr 1fr}
.am-g3{grid-template-columns:1fr 1fr 1fr}
.am-g4{grid-template-columns:1fr 1fr 1fr 1fr}
@media(max-width:700px){.am-g2,.am-g3,.am-g4{grid-template-columns:1fr}}
.am-row{display:flex;flex-direction:column;gap:4px}
.am-row label{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.am-row input,.am-row select,.am-row textarea{padding:7px 9px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);transition:border-color .12s}
.am-row input:focus,.am-row select:focus,.am-row textarea:focus{outline:none;border-color:var(--blue)}
.am-row textarea{resize:vertical;min-height:68px;line-height:1.6}
.am-divider{height:1px;background:var(--border);margin:14px 0}
.am-sub{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;margin-top:2px;display:flex;align-items:center;gap:8px}
.am-sub::after{content:'';flex:1;height:1px;background:var(--border)}
.am-checks{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.am-chk{display:flex;align-items:center;gap:5px;padding:5px 9px;border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;user-select:none;font-size:12px;transition:all .1s;background:var(--bg)}
.am-chk:hover{border-color:var(--blue);background:var(--blue-lt,#eff6ff)}
.am-chk.on{border-color:var(--blue);background:var(--blue-l,#dbeafe);color:var(--blue)}
.am-chkbox{width:13px;height:13px;border:1.5px solid var(--border2);border-radius:3px;flex-shrink:0;transition:all .1s;position:relative}
.am-chk.on .am-chkbox{background:var(--blue);border-color:var(--blue)}
.am-chk.on .am-chkbox::after{content:'';position:absolute;left:2px;top:0px;width:7px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg)}
.am-radios{display:flex;flex-wrap:wrap;gap:7px}
.am-radio{display:flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;font-size:12px;user-select:none;transition:all .1s}
.am-radio:hover{border-color:var(--blue)}
.am-radio.on{border-color:var(--blue);background:var(--blue-l,#dbeafe);color:var(--blue);font-weight:500}
.am-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border);margin-top:16px}
.am-step-info{font-size:12px;color:var(--text2);font-weight:500}
/* Text Output */
.am-textbox{background:var(--blue-lt,#eff6ff);border:1px solid var(--blue-l,#dbeafe);border-radius:var(--radius-lg);padding:16px;margin-top:4px}
.am-text-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.am-text-hdr h3{font-size:13px;font-weight:600;color:var(--blue)}
.am-textcontent{font-size:12px;line-height:1.8;white-space:pre-wrap;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px;min-height:180px;font-family:inherit;color:var(--text)}
.am-spinner{display:none;align-items:center;gap:8px;font-size:12px;color:var(--text2);padding:10px 0}
.am-spin{width:15px;height:15px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.am-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:14px}
.am-sum-card{background:var(--bg2);border-radius:var(--radius);padding:10px 12px;border:1px solid var(--border)}
.am-sum-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);margin-bottom:4px}
.am-sum-val{font-size:12px;font-weight:500}
.am-tag{display:inline-flex;align-items:center;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600}
</style>
</head>
<body>

<div class="app-shell">

<!-- ═══ SIDEBAR ═══════════════════════════════════════════════════════ -->
<aside class="sidebar">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <div>
      <div class="logo-text">SJ Montage</div>
      <div class="logo-sub">Fensterbauer Kalender 2026</div>
    </div>
  </div>

  <div class="nav-section">Planung</div>
  <button class="nav-item active" onclick="showView('kalender')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Kapazitätskalender
  </button>
  <button class="nav-item" onclick="showView('dashboard')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    Dashboard
  </button>
  <button class="nav-item" onclick="showView('projekte')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    Projektstamm
  </button>

  <button class="nav-item" onclick="showView('aufmass')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    Aufmaß Fenster
    <span class="badge" id="aufmass-badge" style="background:#166534">Neu</span>
  </button>

<script>
const YEAR=2026;
const DAYS=['Mo','Di','Mi','Do','Fr'];
const MONTHS=['','Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MONTHS_FULL=['','Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

const HOLIDAYS={
  '2026-01-01':'Neujahr','2026-01-06':'Heilige Drei Könige',
  '2026-04-03':'Karfreitag','2026-04-05':'Ostersonntag','2026-04-06':'Ostermontag',
  '2026-05-01':'Tag der Arbeit','2026-05-14':'Christi Himmelfahrt',
  '2026-05-24':'Pfingstsonntag','2026-05-25':'Pfingstmontag','2026-06-04':'Fronleichnam',
  '2026-10-03':'Tag d. Dt. Einheit','2026-11-01':'Allerheiligen',
  '2026-12-25':'1. Weihnachtstag','2026-12-26':'2. Weihnachtstag'
};

let NUS=[
  {id:1,name:'Fensterbau Müller GmbH',contact:'H. Müller',tel:'+49 711 123456',email:'mueller@fw.de',maxMa:8,color:'#1d4ed8',light:'#dbeafe'},
  {id:2,name:'Fenster & Türen Schmidt KG',contact:'S. Schmidt',tel:'+49 711 234567',email:'schmidt@fw.de',maxMa:6,color:'#92400e',light:'#fef3c7'},
  {id:3,name:'GlasTech Weber GmbH',contact:'M. Weber',tel:'+49 711 345678',email:'weber@fw.de',maxMa:10,color:'#166534',light:'#dcfce7'},
  {id:4,name:'Fensterbau Bauer & Sohn',contact:'T. Bauer',tel:'+49 711 456789',email:'bauer@fw.de',maxMa:5,color:'#4c1d95',light:'#ede9fe'},
  {id:5,name:'Fensterprofi Klein GmbH',contact:'K. Klein',tel:'+49 711 567890',email:'klein@fw.de',maxMa:7,color:'#991b1b',light:'#fee2e2'},
  {id:6,name:'Verglasung Fischer AG',contact:'A. Fischer',tel:'+49 711 678901',email:'fischer@fw.de',maxMa:9,color:'#0e7490',light:'#cffafe'},
];

let PROJEKTE=[
  {pnr:'P-2026-01',name:'Musterstr. 12, Stuttgart',auftraggeber:'Bauträger GmbH',kwVon:24,kwBis:28},
  {pnr:'P-2026-02',name:'Hauptstr. 8, Ludwigsburg',auftraggeber:'Privat Müller',kwVon:25,kwBis:26},
  {pnr:'P-2026-03',name:'Gartenweg 5, Heilbronn',auftraggeber:'Wohnbau AG',kwVon:26,kwBis:30},
];

let entries=[];
let protokoll=[];
let settings={benutzer:'SJ Montage',email:'info@sjmontage.de'};
let editId=null;
let _eid=0;
let currentView='kalender';
let viewKwFrom=24, viewKwTo=28, filterNuId=0;

function kwMonday(kw){
  const jan4=new Date(Date.UTC(YEAR,0,4));
  const dayOfWeek=jan4.getUTCDay()||7;
  const weekStart=new Date(jan4);
  weekStart.setUTCDate(jan4.getUTCDate()-dayOfWeek+1+(kw-1)*7);
  return weekStart;
}
function dateStr(d){return d.toISOString().slice(0,10)}
function fmtD(d){const s=dateStr(d);return s.slice(8)+'.'+s.slice(5,7)+'.'+s.slice(0,4)}
function getKwHols(kw){
  const mo=kwMonday(kw);const h=[];
  for(let d=0;d<5;d++){const s=dateStr(new Date(mo.getTime()+d*86400000));if(HOLIDAYS[s])h.push(HOLIDAYS[s]);}
  return h;
}
function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);
  const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil(((t-y)/86400000+1)/7);
}
function nu(id){return NUS.find(n=>n.id===id)||{name:'?',color:'#888',light:'#eee'}}
function proj(pnr){return PROJEKTE.find(p=>p.pnr===pnr)}
function statusColor(s){return{geplant:'#1d4ed8',bestaetigt:'#166534',abgeschlossen:'#374151',storniert:'#991b1b'}[s]||'#888'}

function toast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+type;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function logChange(action,detail){
  protokoll.push({id:++_eid,dt:new Date().toLocaleString('de-DE'),user:settings.benutzer,action,detail});
  document.getElementById('proto-badge').textContent=protokoll.length;
  saveLocal();
}

function saveLocal(){
  try{localStorage.setItem('sjm_entries',JSON.stringify(entries));
      localStorage.setItem('sjm_proto',JSON.stringify(protokoll));
      localStorage.setItem('sjm_nu',JSON.stringify(NUS));
      localStorage.setItem('sjm_proj',JSON.stringify(PROJEKTE));
      localStorage.setItem('sjm_settings',JSON.stringify(settings));}catch(e){}
}
function loadLocal(){
  try{
    const e=localStorage.getItem('sjm_entries');if(e)entries=JSON.parse(e);
    const p=localStorage.getItem('sjm_proto');if(p)protokoll=JSON.parse(p);
    const n=localStorage.getItem('sjm_nu');if(n)NUS=JSON.parse(n);
    const pj=localStorage.getItem('sjm_proj');if(pj)PROJEKTE=JSON.parse(pj);
    const s=localStorage.getItem('sjm_settings');if(s)settings=JSON.parse(s);
    if(entries.length)_eid=Math.max(...entries.map(e=>e.id),...protokoll.map(p=>p.id),0);
  }catch(e){}
}

/* ══ VIEWS ══════════════════════════════════════════════════════════ */
function showView(v){
  currentView=v;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el=>{
    if(el.getAttribute('onclick')&&el.getAttribute('onclick').includes(`'${v}'`))el.classList.add('active');
  });
  const titles={kalender:'Kapazitätskalender',dashboard:'Dashboard',projekte:'Projektstamm',aufmass:'Aufmaß Fenster – Montageplanung',
    nu:'Fensterbauer',auswertung:'Monatsauswertung',protokoll:'Änderungsprotokoll',einstellungen:'Einstellungen'};
  document.getElementById('view-title').textContent=titles[v]||v;
  const c=document.getElementById('content-area');
  if(v==='kalender')renderKalender(c);
  else if(v==='dashboard')renderDashboard(c);
  else if(v==='projekte')renderProjekte(c);
  else if(v==='nu')renderNU(c);
  else if(v==='auswertung')renderAuswertung(c);
  else if(v==='protokoll')renderProtokolll(c);
  else if(v==='einstellungen')renderEinstellungen(c);
  else if(v==='aufmass')renderAufmass(c);
}

/* ══ KALENDER ═══════════════════════════════════════════════════════ */
function renderKalender(c){
  const curKw=Math.max(1,Math.min(52,isoWeek(new Date())));
  if(!viewKwFrom)viewKwFrom=Math.max(1,curKw-1);
  if(!viewKwTo)viewKwTo=Math.min(52,curKw+5);

  let kwOpts='';for(let k=1;k<=52;k++){const mo=kwMonday(k);kwOpts+=`<option value="${k}" ${k===viewKwFrom?'selected':''}>KW ${k}  (${fmtD(mo)})</option>`;}
  let kwOpts2='';for(let k=1;k<=52;k++){const mo=kwMonday(k);kwOpts2+=`<option value="${k}" ${k===viewKwTo?'selected':''}>KW ${k}  (${fmtD(mo)})</option>`;}
  let nuOpts=`<option value="0">Alle Fensterbauer</option>`;NUS.forEach(n=>nuOpts+=`<option value="${n.id}" ${n.id===filterNuId?'selected':''}>${n.name}</option>`);

  const conflicts=findConflicts();
  const conflictHtml=conflicts.length?`<div class="conflict-bar show">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    ${conflicts.map(cf=>`<strong>${nu(cf.nuId).name}</strong> – KW ${cf.kw}: ${cf.count} Projekte gleichzeitig`).join(' &nbsp;|&nbsp; ')}
  </div>`:'';

  c.innerHTML=`
  <div class="stats-row" id="stats-row"></div>
  ${conflictHtml}
  <div class="toolbar">
    <label>Von</label>
    <select id="kw-from" onchange="viewKwFrom=+this.value;showView('kalender')">${kwOpts}</select>
    <label>bis</label>
    <select id="kw-to" onchange="viewKwTo=+this.value;showView('kalender')">${kwOpts2}</select>
    <div class="toolbar-sep"></div>
    <label>Fensterbauer</label>
    <select id="fil-nu" onchange="filterNuId=+this.value;showView('kalender')">${nuOpts}</select>
    <div class="toolbar-sep"></div>
    <button class="btn sm" onclick="viewKwFrom=Math.max(1,viewKwFrom-1);viewKwTo=Math.max(2,viewKwTo-1);showView('kalender')">← zurück</button>
    <button class="btn sm" onclick="viewKwFrom=Math.min(51,viewKwFrom+1);viewKwTo=Math.min(52,viewKwTo+1);showView('kalender')">vor →</button>
    <button class="btn sm primary" onclick="addProjModal()">+ Eintrag</button>
  </div>
  <div class="cal-wrap">
    <div class="cal-scroll">
      <table><thead id="cal-head"></thead><tbody id="cal-body"></tbody></table>
    </div>
  </div>`;

  renderStats();
  const visNus=filterNuId?NUS.filter(n=>n.id===filterNuId):NUS;
  renderHead(visNus);
  renderBody(visNus);
}

function renderStats(){
  const e2=entries.filter(e=>e.kw>=viewKwFrom&&e.kw<=viewKwTo);
  const ma=e2.reduce((s,e)=>s+e.ma,0);
  const busyNus=new Set(e2.map(e=>e.nuId)).size;
  const cf=findConflicts();
  document.getElementById('stats-row').innerHTML=`
    <div class="stat-card"><div class="stat-label">Einträge im Zeitraum</div><div class="stat-val">${e2.length}</div><div class="stat-sub">KW ${viewKwFrom} – ${viewKwTo}</div></div>
    <div class="stat-card"><div class="stat-label">Monteure gesamt</div><div class="stat-val">${ma}</div><div class="stat-sub">MA in diesem Zeitraum</div></div>
    <div class="stat-card"><div class="stat-label">Aktive Fensterbauer</div><div class="stat-val">${busyNus} / ${NUS.length}</div><div class="stat-sub">im Zeitraum eingeplant</div></div>
    <div class="stat-card${cf.length?' warn':''}"><div class="stat-label" style="${cf.length?'color:var(--red)':''}">Konflikte</div><div class="stat-val">${cf.length}</div><div class="stat-sub">${cf.length?'Doppelbelegungen!':'Keine Konflikte'}</div></div>`;
}

function renderHead(visNus){
  document.getElementById('cal-head').innerHTML=`<tr>
    <th style="width:40px">KW</th>
    <th style="width:82px">Datum</th>
    <th style="width:95px">Feiertage BW</th>
    ${visNus.map(n=>`<th class="nu-th" style="background:${n.color}">${n.name}</th>`).join('')}
  </tr>`;
}

function renderBody(visNus){
  const body=document.getElementById('cal-body');
  let html='';
  for(let kw=viewKwFrom;kw<=viewKwTo;kw++){
    const mo=kwMonday(kw),fr=new Date(mo.getTime()+4*86400000);
    const hols=getKwHols(kw),isFt=hols.length>0;
    const ftCls=isFt?' ft-row':'';
    const byNu={};visNus.forEach(n=>{byNu[n.id]=entries.filter(e=>e.kw===kw&&e.nuId===n.id);});
    const maxP=Math.max(1,...visNus.map(n=>byNu[n.id].length));

    for(let p=0;p<maxP;p++){
      const isFirst=p===0;
      html+=`<tr class="${isFirst?'kw-first':''}${ftCls}">`;
      if(isFirst){
        html+=`<td class="kw-td" rowspan="${maxP}"><div style="font-size:15px;font-weight:700">${kw}</div><div style="font-size:10px;color:var(--text2);font-weight:400">${MONTHS[mo.getUTCMonth()+1]}</div></td>`;
        html+=`<td class="date-td" rowspan="${maxP}">${fmtD(mo)}<br><span style="opacity:.5">–</span><br>${fmtD(fr)}</td>`;
        html+=`<td class="ft-td" rowspan="${maxP}">${hols.length?hols.join('<br>'):'–'}</td>`;
      }
      visNus.forEach(n=>{
        const e=byNu[n.id][p];
        const bg=isFt?'#fff5f5':n.light+'55';
        html+=`<td style="background:${bg};min-width:140px"><div class="proj-cell">${e?projTag(e,n):''}`;
        if(p===byNu[n.id].length-1){html+=`<button class="add-btn" onclick="addProjModal(${n.id},${kw})">+ Projekt</button>`;}
        html+=`</div></td>`;
      });
      html+=`</tr>`;
    }
    html+=`<tr class="sep-row"><td colspan="${3+visNus.length}"></td></tr>`;
  }
  body.innerHTML=html;
}

function projTag(e,n){
  const sColor=statusColor(e.status||'geplant');
  const dots=DAYS.map((_,i)=>`<div class="dot ${e.days.includes(i)?'on':'off'}"></div>`).join('');
  return `<button class="proj-tag" style="background:${n.color}" onclick="editEntry(${e.id})" title="${e.name}\n${e.ma} MA · ${(e.status||'geplant')}">
    <div class="proj-tag-top">
      <span class="proj-tag-pnr">${e.pnr}</span>
      <span class="proj-tag-ma">${e.ma} MA</span>
    </div>
    <div class="proj-tag-name">${e.name}</div>
    <div class="day-dots">${dots}</div>
  </button>`;
}

/* ══ DASHBOARD ══════════════════════════════════════════════════════ */
function renderDashboard(c){
  const curKw=isoWeek(new Date());
  const mo=kwMonday(curKw);
  const e_cur=entries.filter(e=>e.kw===curKw);
  const e_nxt=entries.filter(e=>e.kw===curKw+1);
  c.innerHTML=`
  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Aktuelle KW</div><div class="stat-val">${curKw}</div><div class="stat-sub">${fmtD(mo)} – ${fmtD(new Date(mo.getTime()+4*86400000))}</div></div>
    <div class="stat-card"><div class="stat-label">Einträge diese Woche</div><div class="stat-val">${e_cur.length}</div></div>
    <div class="stat-card"><div class="stat-label">MA diese Woche</div><div class="stat-val">${e_cur.reduce((s,e)=>s+e.ma,0)}</div></div>
    <div class="stat-card"><div class="stat-label">Einträge nächste Woche</div><div class="stat-val">${e_nxt.length}</div></div>
  </div>
  <div style="font-size:13px;font-weight:600;margin-bottom:10px">KW ${curKw} – Aktuelle Woche</div>

function initModal(){
  const mn=document.getElementById('m-nu');mn.innerHTML='';
  NUS.forEach(n=>mn.add(new Option(n.name,n.id)));
  const mk=document.getElementById('m-kw');mk.innerHTML='';
  for(let k=1;k<=52;k++){const mo=kwMonday(k);mk.add(new Option(`KW ${k}  (${fmtD(mo)})`,k));}
  document.querySelectorAll('#m-days .day-btn').forEach(b=>{
    b.onclick=()=>b.classList.toggle('on');
  });
  document.getElementById('m-pnr').oninput=function(){
    const p=proj(this.value.trim());
    const hint=document.getElementById('m-proj-hint');
    if(p){hint.textContent='Gefunden: '+p.name;hint.style.color='var(--green)';}
    else{hint.textContent='';} 
    checkConflictHint();
  };
  document.getElementById('m-nu').onchange=checkConflictHint;
  document.getElementById('m-kw').onchange=checkConflictHint;
}

function checkConflictHint(){
  const nuId=+document.getElementById('m-nu').value;
  const kw=+document.getElementById('m-kw').value;
  const existing=entries.filter(e=>e.nuId===nuId&&e.kw===kw&&(!editId||e.id!==editId));
  const hint=document.getElementById('conflict-hint');
  const maxMa=(NUS.find(n=>n.id===nuId)||{}).maxMa||99;
  const totalMa=existing.reduce((s,e)=>s+e.ma,0)+(+document.getElementById('m-ma').value||0);
  if(existing.length>=3){hint.style.display='block';hint.textContent=`Hinweis: ${nu(nuId).name} hat bereits ${existing.length} Projekte in KW ${kw}.`;}
  else if(totalMa>maxMa){hint.style.display='block';hint.textContent=`Achtung: Max. Kapazität (${maxMa} MA) wird überschritten.`;}
  else{hint.style.display='none';}
}

function saveEntry(){
  const pnr=document.getElementById('m-pnr').value.trim();
  const name=document.getElementById('m-name').value.trim();
  const nuId=+document.getElementById('m-nu').value;
  const kw=+document.getElementById('m-kw').value;
  const ma=+document.getElementById('m-ma').value||1;
  const note=document.getElementById('m-note').value.trim();
  const status=document.getElementById('m-status').value;
  const days=[...document.querySelectorAll('#m-days .day-btn.on')].map(b=>+b.dataset.d);
  if(!pnr||!name||!nuId||!kw){alert('Bitte alle Pflichtfelder ausfüllen.');return;}
  if(editId){
    const e=entries.find(x=>x.id===editId);
    if(e){
      const old=JSON.stringify(e);
      Object.assign(e,{pnr,name,nuId,kw,ma,days,note,status});
      logChange('Eintrag geändert',`${nu(nuId).name} | ${pnr} | KW ${kw}`);
    }
  } else {
    entries.push({id:++_eid,pnr,name,nuId,kw,ma,days,note,status});
    logChange('Eintrag hinzugefügt',`${nu(nuId).name} | ${pnr} | KW ${kw} | ${ma} MA`);
  }
  closeModal();saveLocal();showView('kalender');toast(editId?'Eintrag aktualisiert':'Eintrag gespeichert');
}

function deleteEntry(){
  if(!editId||!confirm('Eintrag wirklich löschen?'))return;
  const e=entries.find(x=>x.id===editId);
  if(e)logChange('Eintrag gelöscht',`${nu(e.nuId).name} | ${e.pnr} | KW ${e.kw}`);
  entries=entries.filter(x=>x.id!==editId);
  closeModal();saveLocal();showView('kalender');toast('Eintrag gelöscht','error');
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}

/* ══ KONFLIKTE ════════════════════════════════════════════════════════ */
function findConflicts(){
  const cf=[];
  NUS.forEach(n=>{
    const byKw={};
    entries.filter(e=>e.nuId===n.id).forEach(e=>{if(!byKw[e.kw])byKw[e.kw]=[];byKw[e.kw].push(e);});
    Object.entries(byKw).forEach(([kw,es])=>{if(es.length>3)cf.push({nuId:n.id,kw:+kw,count:es.length});});
  });
  return cf;
}

function exportJSON(){
  const data={entries,protokoll,NUS,PROJEKTE,settings,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`sjm_kalender_${new Date().toISOString().slice(0,10)}.json`;a.click();
  logChange('Daten exportiert',`${entries.length} Einträge`);
  toast('Daten gespeichert');
}

function importJSON(){document.getElementById('file-import')&&document.getElementById('file-import').click();}
function handleImport(input){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{try{
    const d=JSON.parse(e.target.result);
    if(d.entries)entries=d.entries;
    if(d.protokoll)protokoll=d.protokoll;
    if(d.NUS)NUS=d.NUS;
    if(d.PROJEKTE)PROJEKTE=d.PROJEKTE;
    if(d.settings)settings=d.settings;
    if(entries.length)_eid=Math.max(...entries.map(e=>e.id),...protokoll.map(p=>p.id),0);
    saveLocal();showView(currentView);toast('Daten importiert');
  }catch(err){toast('Importfehler','error');}};
  r.readAsText(file);
}

function resetData(){
  if(!confirm('Wirklich alle Einträge löschen? Das kann nicht rückgängig gemacht werden!'))return;
  entries=[];protokoll=[];saveLocal();showView(currentView);toast('Daten gelöscht','error');
}

/* ══ AUFMAß ═════════════════════════════════════════════════════════ */
let amStep=0;
const AM_TOTAL=8;
let amData={};

function amV(id){const el=document.getElementById(id);return el?el.value.trim():'';}

function amToggle(el,hidId){
  el.classList.toggle('on');
  const g=el.closest('.am-checks');
  if(g&&hidId){const vals=[...g.querySelectorAll('.am-chk.on')].map(e=>e.dataset.val);document.getElementById(hidId).value=vals.join(', ');}
}
function amRadio(el,grpId,hidId){
  document.querySelectorAll('#'+grpId+' .am-radio').forEach(r=>r.classList.remove('on'));
  el.classList.add('on');
  if(hidId)document.getElementById(hidId).value=el.dataset.val;
}

function amGoStep(n){
  amStep=n;
  renderAufmassContent();
  document.getElementById('content-area').scrollTop=0;
}
function amNext(){if(amStep<AM_TOTAL-1){amStep++;renderAufmassContent();}}
function amPrev(){if(amStep>0){amStep--;renderAufmassContent();}}

function renderAufmass(c){
  amStep=0;
  c.innerHTML=`<div id="am-wrap"></div>`;
  renderAufmassContent();
}

function renderAufmassContent(){
  const wrap=document.getElementById('am-wrap');
  if(!wrap)return;

  // Steps bar
  const stepLabels=['Auftrag','Fenster','Rolladen','Mauerwerk','Montage','Baustelle','Bemerkungen','Montagetext'];
  const stepBar=stepLabels.map((s,i)=>`<div class="am-step${i===amStep?' cur':i<amStep?' done':''}" onclick="amGoStep(${i})"><span class="am-snum">${i+1}</span>${s}</div>`).join('');

  // Content per step
  let body='';
  if(amStep===0) body=amStepAuftrag();
  else if(amStep===1) body=amStepFenster();
  else if(amStep===2) body=amStepRolladen();
  else if(amStep===3) body=amStepMauerwerk();
  else if(amStep===4) body=amStepMontage();
  else if(amStep===5) body=amStepBaustelle();
  else if(amStep===6) body=amStepBemerkungen();
  else if(amStep===7) body=amStepText();

  wrap.innerHTML=`
    <div class="am-steps">${stepBar}</div>
    ${body}
    <div class="am-nav">
      <button class="btn${amStep===0?' ':''}" onclick="amPrev()" ${amStep===0?'style="visibility:hidden"':''}>← Zurück</button>
      <span class="am-step-info">Schritt ${amStep+1} von ${AM_TOTAL}</span>
      <button class="btn primary" onclick="${amStep===AM_TOTAL-1?'amGenerateText()':'amNext()'}">${amStep===AM_TOTAL-1?'✦ Text generieren':'Weiter →'}</button>
    </div>`;

  // Restore saved values
  Object.keys(amData).forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    if(el.tagName==='INPUT'||el.tagName==='SELECT'||el.tagName==='TEXTAREA')el.value=amData[id];
  });
  // Restore toggles
  document.querySelectorAll('.am-chk[data-val]').forEach(el=>{
    const hid=el.closest('.am-checks')?.nextElementSibling;
    if(!hid)return;
    const vals=(amData[hid.id]||'').split(', ');
    if(vals.includes(el.dataset.val))el.classList.add('on'); else el.classList.remove('on');
  });
  document.querySelectorAll('.am-radio[data-val]').forEach(el=>{
    const hid=document.getElementById(el.closest('[id]')?.id?.replace(/_grp$/,'')+'_val');
    // simpler: check all hidden inputs
  });

  if(amStep===AM_TOTAL-1) amBuildSummary();
}

function amAutoFillFromProj(pnr){
  const p=PROJEKTE.find(x=>x.pnr===pnr);
  if(!p)return;
  const nameEl=document.getElementById('am_name');
  if(nameEl&&!nameEl.value){nameEl.value=p.name;amData['am_name']=p.name;}
  const kwEl=document.getElementById('am_kw');
  if(kwEl&&!kwEl.value&&p.kwVon){kwEl.value=p.kwVon;amData['am_kw']=p.kwVon;}
}

async function amGenerateText(){
  const d=amData;
  const spinner=document.getElementById('am_spinner');
  const box=document.getElementById('am_textcontent');
  const status=document.getElementById('am_textstatus');
  if(spinner)spinner.style.display='flex';
  if(box)box.textContent='';
  if(status)status.textContent='Wird generiert...';

  const lines=Object.entries(d).filter(([k,v])=>v&&v.toString().trim()).map(([k,v])=>`${k}: ${v}`).join('\n');

  const prompt=`Du bist Montagekoordinator bei SJ Montage (Fensterbauer, Baden-Württemberg).
Erstelle einen vollständigen, professionellen Montageauftrag / Montagetext auf Deutsch.

Der Text soll klar gegliedert sein in:
1. AUFTRAGSÜBERSICHT (Auftragsnr., Baustelle, Ansprechpartner, Termin, Fensterbauer-NU, KW, Anzahl FE)
2. FENSTER-SPEZIFIKATION (Profil, Verglasung, Farben, Dichtung, Griff, Details)
3. ROLLADEN / SONNENSCHUTZ (Typ, Antrieb, Kasten, Behang, Alu-Bank)
4. MAUERWERK & ANSCHLUSS (Wandaufbau, Abdichtung, Befestigung, Verleistung)
5. MONTAGEHINWEISE (Leistungsumfang, Demontage, Entsorgung, Fußbodenhöhen)
6. BAUSTELLENSITUATION (Zufahrt, Kran/Gerüst, Klassifizierung, Zugang)
7. BESONDERHEITEN & BEMERKUNGEN (alle Freitextfelder, Bestandssituation, Hinweise für Monteur)
8. UNTERSCHRIFT / BESTÄTIGUNG (Zeile für Datum + Unterschrift)

Regeln:
- Nur ausgefüllte Felder verwenden, leere ignorieren
- Technisch präzise, keine Marketingsprache
- Kompakt aber vollständig
- Deutsche Fachbegriffe aus dem Fensterbau verwenden

Aufmaßdaten:
${lines}

Schreibe jetzt den vollständigen Montagetext:`;

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    const json=await resp.json();
    const text=json.content&&json.content[0]&&json.content[0].text||'Fehler.';
    if(box)box.textContent=text;
    if(status)status.textContent='Fertig';
    toast('Montagetext generiert','ok');
  }catch(e){
    if(box)box.textContent=amFallbackText(d);
    if(status)status.textContent='Offline-Modus';
    toast('Offline – lokaler Text generiert');
  }
  if(spinner)spinner.style.display='none';
}

function amFallbackText(d){
  const now=new Date().toLocaleDateString('de-DE');
  const hr='─'.repeat(52);
  let t='MONTAGEAUFTRAG – SJ MONTAGE\n'+hr+'\n';
  t+=`Stand: ${now}\n\n`;
  t+='1. AUFTRAGSÜBERSICHT\n';
  if(d.am_auftragsnr)t+=`   Auftrags-Nr.:    ${d.am_auftragsnr}\n`;
  if(d.am_projnr)    t+=`   Projekt-Nr.:     ${d.am_projnr}\n`;
  if(d.am_name)      t+=`   Baustelle:       ${d.am_name}\n`;
  if(d.am_ort)       t+=`   Ort:             ${d.am_ort}\n`;
  if(d.am_ap)        t+=`   Ansprechpartner: ${d.am_ap}${d.am_tel?' · '+d.am_tel:''}\n`;
  if(d.am_termin)    t+=`   Wunschtermin:    ${d.am_termin}\n`;
  if(d.am_nu)        t+=`   Fensterbauer:    ${d.am_nu}\n`;
  if(d.am_kw)        t+=`   Geplante KW:     KW ${d.am_kw}\n`;
  if(d.am_fe)        t+=`   Anzahl FE:       ${d.am_fe} Stück\n`;
  if(d.am_eh)        t+=`   Einbauhöhe:      ${d.am_eh}\n`;
  if(d.am_projektart)t+=`   Projektart:      ${d.am_projektart}\n`;
  t+='\n';
  if(d.am_profil||d.am_glas){
    t+='2. FENSTER-SPEZIFIKATION\n';
    if(d.am_profil) t+=`   Profil:          ${d.am_profil}\n`;
    if(d.am_glas)   t+=`   Verglasung:      ${d.am_glas}${d.am_ug?' · UG-Wert '+d.am_ug+' W/m²K':''}\n`;
    if(d.am_fi)     t+=`   Farbe innen:     ${d.am_fi}\n`;
    if(d.am_fa)     t+=`   Farbe außen:     ${d.am_fa}\n`;
    if(d.am_dicht)  t+=`   Dichtungen:      ${d.am_dicht}\n`;
    if(d.am_gle)    t+=`   Glasleiste:      ${d.am_gle}\n`;
    if(d.am_schall) t+=`   Schallschutz:    ${d.am_schall}\n`;
    if(d.am_glasopt)t+=`   Optionen:        ${d.am_glasopt}\n`;
    if(d.am_griff)  t+=`   Griff:           ${d.am_griff}${d.am_grifffarbe?' · '+d.am_grifffarbe:''}\n`;
    t+='\n';
  }
  if(d.am_rltyp||d.am_antrieb){
    t+='3. ROLLADEN / SONNENSCHUTZ\n';
    if(d.am_rltyp)        t+=`   Typ:             ${d.am_rltyp}\n`;
    if(d.am_antrieb)      t+=`   Antrieb:         ${d.am_antrieb}\n`;
    if(d.am_kfarbe)       t+=`   Farbe Kasten:    ${d.am_kfarbe}\n`;
    if(d.am_lamellefarbe) t+=`   Farbe Lamellen:  ${d.am_lamellefarbe}\n`;
    if(d.am_kastopt)      t+=`   Kasten-Opt.:     ${d.am_kastopt}\n`;
    if(d.am_bank)         t+=`   Alu-Fensterbank: anpassen${d.am_bankausl?' · Ausladung '+d.am_bankausl+' mm':''}\n`;
    t+='\n';
  }
  if(d.am_mwbez||d.am_befest||d.am_abdicht){
    t+='4. MAUERWERK & ANSCHLUSS\n';
    if(d.am_mwbez)   t+=`   Mauerwerk:       ${d.am_mwbez}${d.am_mwst?' · '+d.am_mwst+' mm':''}\n`;
    if(d.am_mwtyp)   t+=`   Anschluss:       ${d.am_mwtyp}\n`;
    if(d.am_daemst)  t+=`   Dämmung stirn.:  ${d.am_daemst}\n`;
    if(d.am_daeml)   t+=`   Dämmung Laibung: ${d.am_daeml}\n`;
    if(d.am_befest)  t+=`   Befestigung:     ${d.am_befest}\n`;
    if(d.am_abdicht) t+=`   Abdichtung:      ${d.am_abdicht}\n`;
    if(d.am_verl)    t+=`   Verleistung:     ${d.am_verl}\n`;
    if(d.am_bord)    t+=`   Bordstücke:      ${d.am_bord}\n`;
    t+='\n';
  }
  if(d.am_leist||d.am_dem){
    t+='5. MONTAGEHINWEISE\n';
    if(d.am_leist)  t+=`   Leistung:        ${d.am_leist}\n`;
    if(d.am_dem)    t+=`   Demontage:       ${d.am_dem}\n`;
    if(d.am_ents)   t+=`   Entsorgung:      ${d.am_ents}\n`;
    if(d.am_meter)  t+=`   Meterriss:       ${d.am_meter}\n`;
    const fh=[d.am_fhkg&&'KG: '+d.am_fhkg,d.am_fheg&&'EG: '+d.am_fheg,d.am_fhog&&'OG: '+d.am_fhog,d.am_fhdg&&'DG: '+d.am_fhdg].filter(Boolean).join(' · ');
    if(fh)          t+=`   Fußbodenhöhen:   ${fh}\n`;
    t+='\n';
  }
  if(d.am_klass||d.am_lkw||d.am_kran){
    t+='6. BAUSTELLENSITUATION\n';
    if(d.am_einbsit)t+=`   Einbausituation: ${d.am_einbsit}\n`;
    if(d.am_lkw)    t+=`   LKW-Zufahrt:     ${d.am_lkw}\n`;
    if(d.am_kran)   t+=`   Kran/Gerüst:     ${d.am_kran}\n`;
    if(d.am_klass)  t+=`   Klassifizierung: ${d.am_klass}\n`;
    t+='\n';
  }
  if(d.am_bestand||d.am_einbsit_text||d.am_bemerk){
    t+='7. BESONDERHEITEN & BEMERKUNGEN\n';
    if(d.am_bestand)      t+=`   Bestand:         ${d.am_bestand}\n`;
    if(d.am_einbsit_text) t+=`   Einbausituation: ${d.am_einbsit_text}\n`;
    if(d.am_bemerk)       t+=`   Hinweise:        ${d.am_bemerk}\n`;
    t+='\n';
  }
  t+=hr+'\n';
  t+='8. BESTÄTIGUNG\n\n';
  t+='   Datum: _______________    Unterschrift Auftraggeber: _______________\n\n';
  t+='   SJMontage · Sommerhaldenstr. 2 · 71729 Erdmannhausen\n';
  t+='   Tel: 0 172 706605 · info@sjmontage.de\n';
  return t;
}

  const txt=document.getElementById('am_textcontent')?.textContent||'';
  navigator.clipboard.writeText(txt).then(()=>toast('Montagetext kopiert','ok')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('Montagetext kopiert','ok');
  });
}

function amSaveToProtokoll(){
  const d=amData;
  const detail=`Aufmaß ${d.am_auftragsnr||'?'} · ${d.am_name||''} · NU: ${d.am_nu||''} · KW ${d.am_kw||'?'}`;
  logChange('Aufmaß erfasst', detail);
  toast('Im Protokoll gespeichert','ok');
}

</script>
